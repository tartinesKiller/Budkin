# Dev APK on plain GitHub runners, no EAS account needed. APP_VARIANT=development
# makes app.config.js rename the app to "Budkin (dev)" and switch the package to
# dev.karellievens.budkin.dev, so the APK installs ALONGSIDE the release app.
# Debug APKs are signed with the throwaway debug keystore, which is fine for testing.
name: Android dev APK

on:
  push:
    branches: [vibe/**]
  workflow_dispatch:

jobs:
  apk-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a RN APK build takes ~10-20 min; 6h is the hard per-job cap
    env:
      APP_VARIANT: development
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ubuntu-latest ships the Android SDK; RN needs JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - name: Build dev APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: budkin-dev-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
