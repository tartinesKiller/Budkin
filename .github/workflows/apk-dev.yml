# Dev APK on plain GitHub runners, no EAS account needed. APP_VARIANT=development
# makes app.config.js rename the app to "Budkin (dev)" and switch the package to
# dev.karellievens.budkin.dev, so the APK installs ALONGSIDE the release app.
# Debug APKs are signed with the throwaway debug keystore, which is fine for testing.
name: Android dev APK

on:
  push:
    branches: [vibe/**]
  workflow_dispatch:

jobs:
  apk-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a RN APK build takes ~10-20 min; 6h is the hard per-job cap
    env:
      APP_VARIANT: development
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ubuntu-latest ships the Android SDK; RN needs JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      # assembleDebug would ship expo-dev-client's "Development Build" launcher screen
      # instead of the app. Build RELEASE (the standalone app) and sign it with the
      # throwaway debug keystore via the injected-signing properties, so no secret is
      # needed and the APK still installs on any device.
      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build dev APK (release, debug-signed)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - uses: actions/upload-artifact@v4
        with:
          name: budkin-dev-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
